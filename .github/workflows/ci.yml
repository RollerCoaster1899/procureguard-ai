name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src tests scripts

      - name: Format check
        run: uv run ruff format --check src tests scripts

      - name: Type check
        run: uv run mypy src/procureguard

      - name: Unit, integration, and smoke tests with coverage
        run: uv run pytest -q --cov=src/procureguard --cov-branch --cov-report=term

      - name: Static security scan
        run: uv run bandit -r src/procureguard

      - name: Dependency vulnerability audit
        run: uv run pip-audit --local --skip-editable

      - name: Offline smoke reproduce
        run: uv run python scripts/reproduce.py --smoke --output reports_smoke
