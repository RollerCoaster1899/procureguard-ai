# Experiment configuration used by the reproduce pipeline.
# The reproduce script loads configs/base.yaml; this file documents the
# canonical experiment parameters and can be passed via --config.

data:
  seed: 42
  numScenarios: 24
  trainCount: 12
  valCount: 6
  testCount: 6
  adversarialIndices: [5, 10, 15, 22, 23]

retrieval:
  topK: 10
  candidateCount: 200
  lsaComponents: 100
  rrfK: 60

workflow:
  topK: 5
  methods: [rules_baseline, rag_only, rag_mcp, guarded_rag_mcp]
  provider: scripted
  mcpTimeoutSeconds: 15.0

bootstrap:
  nResamples: 1000
  seed: 7
  alpha: 0.05
